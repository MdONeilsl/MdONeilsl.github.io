<body>
    <header role="banner">
        <h1 itemprop="headline">Normal map from heightmap</h1>
    </header>

    <div id="app-core" itemprop="mainContentOfPage">
        <section id="upload-section" aria-labelledby="upload-heading">
            <div id="drop-zone" role="region" aria-label="File upload area">
                <p>Drag and Drop Heightmap Here</p>
                <p class="small-text">or click to select file (JPEG, PNG, WebP)</p>
                <input type="file" id="file_input" accept="image/jpeg, image/png, image/webp"
                    aria-label="Select image file" style="display: none;">
            </div>
        </section>

        <main id="app-content">
            <section id="settings-section" aria-labelledby="settings-heading">
                <h2 id="settings-heading">⚙️ Settings</h2>
                <form id="image-settings" role="form" aria-label="Image processing settings">
                    <div class="form-group">
                        <label for="strength">Strength (0-10):</label>
                        <input type="number" id="strength" name="strength" min="0.1" max="10" value="5" step="0.1"
                            aria-describedby="strength-help">
                        <span id="strength-help" class="visually-hidden">Adjusts the intensity of the normal map
                            effect</span>
                    </div>

                    <div class="form-group">
                        <label>Channel Inversion:</label>
                        <div class="checkbox-group">
                            <input type="checkbox" id="invert_red" name="invert_red" aria-label="Invert red channel">
                            <label for="invert_red">Invert Red Channel</label>
                        </div>
                        <div class="checkbox-group">
                            <input type="checkbox" id="invert_green" name="invert_green"
                                aria-label="Invert green channel">
                            <label for="invert_green">Invert Green Channel</label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="smoothing">Smoothing (0-3):</label>
                        <div id="smoothing-container">
                            <input type="range" id="smoothing" name="smoothing" min="0" max="3" value="0"
                                aria-label="Smoothing level" aria-valuetext="Level 0">
                            <span id="smoothing-value">0</span>
                        </div>
                    </div>

                    <div class="form-group">
                        <div class="checkbox-group">
                            <input type="checkbox" id="use_scharr" name="use_scharr"
                                aria-label="Use Scharr filter for edge detection">
                            <label for="use_scharr">Use Scharr Filter</label>
                        </div>
                    </div>
                </form>
                <div id="status-message" role="status" aria-live="polite" aria-atomic="true">
                    Drop an image above to begin processing.
                </div>
            </section>

            <section id="preview-section" aria-labelledby="preview-heading">
                <div class="canvas-container">
                    <canvas id="image-canvas" role="img"
                        aria-label="Image preview showing original and processed comparison" width="800" height="600">
                        Your browser does not support the canvas element.
                    </canvas>
                    <input type="range" id="comparison-slider" min="0" max="100" value="50"
                        aria-label="Comparison slider to adjust view between original and processed image"
                        aria-valuetext="50 percent">
                </div>
            </section>

            <section id="controls-section" aria-labelledby="controls-heading">
                <button id="save-button" type="button" aria-label="Save processed image">
                    💾 Save Image
                </button>
                <button id="reset-button" type="button" aria-label="Reset all settings to default">
                    ↩️ Reset Settings
                </button>
            </section>
        </main>
    </div>
