<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tag Classifier - Drag & Drop JSON Builder (v2)</title>
</head>

<body>
    <link rel="stylesheet" href="./css/styles.css">

    <!-- TOP BAR -->
    <div class="top-bar">
        <div class="file-section">
            <label for="tagFileInput">📂 Load Tag JSON</label>
            <input type="file" id="tagFileInput" accept=".json">
            <span class="file-info" id="fileInfo">No file loaded</span>
        </div>
        <div class="filter-group">
            <div class="filter-item">
                <label>🔎 Filter by name:</label>
                <input type="text" id="nameFilterInput" class="name-filter" placeholder="e.g. hair, face..." autocomplete="off">
            </div>
            <div class="filter-item">
                <label>✅ Show tags with categories:</label>
                <textarea class="show-filter" id="showFilter" placeholder="e.g. body face hair" rows="1"></textarea>
            </div>
            <div class="filter-item">
                <label>❌ Hide tags with categories:</label>
                <textarea class="hide-filter" id="hideFilter" placeholder="e.g. nsfw extra" rows="1">original, character, name, original_character, artist_original, person, series, title, fictional_character, artist, creator</textarea>
            </div>
        </div>
        <div class="stats">
            Available: <span id="availableCount">0</span> &nbsp;|&nbsp;
            Classified: <span id="classifiedCount">0</span> &nbsp;|&nbsp;
            Total: <span id="totalCount">0</span>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <!-- LEFT PANEL: Available Tags -->
        <div class="left-panel" id="leftPanel">
            <div class="panel-header">
                🏷️ Available Tags
                <span class="count" id="leftCount">0</span>
            </div>
            <div class="tags-container" id="availableTagsContainer"
                 ondragover="handleLeftPanelDragOver(event)"
                 ondragleave="handleLeftPanelDragLeave(event)"
                 ondrop="handleLeftPanelDrop(event)">
                <div class="no-tags">Load a JSON file to see tags</div>
            </div>
        </div>

        <!-- RIGHT PANEL: JSON Structure -->
        <div class="right-panel" id="rightPanel">
            <div class="panel-header">
                📋 Drop Tags onto Sections
                <div class="header-actions">
                    <span style="font-size:0.7rem;color:var(--text2);" id="rightTagCount">0 tags placed</span>
                    <button class="btn-reset" onclick="resetAllTags()" title="Remove all placed tags">🔄 Reset All</button>
                    <button class="btn-template" id="loadTemplateBtn" title="Load a custom template (JSON)">📂 Load Template</button>
                    <button class="btn-save" onclick="saveJSON()">💾 Save JSON</button>
                </div>
            </div>
            <!-- Hidden file input for template loading -->
            <input type="file" id="templateFileInput" accept=".json" style="display: none;">

            <div class="right-filter-bar">
                <label>🔎 Filter sections:</label>
                <input type="text" id="rightSectionFilter" placeholder="e.g. head, arm, hand..." autocomplete="off">
                <span class="filter-count" id="rightFilterCount">0 hidden</span>
            </div>
            <div class="sections-grid" id="sectionsGrid">
                <!-- Dynamically filled -->
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div id="toastContainer"></div>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
